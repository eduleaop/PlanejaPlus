  <body>
    <header class="topbar">
      <a class="brand" href="./index.html">
        <img src="./img/logo.png" alt="Planeja+" class="brand-logo brand-logo-light" />
        <img src="./img/logo-dark.png" alt="" aria-hidden="true" class="brand-logo brand-logo-dark" />
      </a>
      <nav class="nav">
        <a href="./dashboard.html" data-auth-required>Dashboard</a>
        <a href="./cadastro.html" data-public-registration>Cadastro</a>
        <a href="./login.html">Login</a>
        <a href="./faq.html">FAQ</a>
        <label class="switch">
          <span class="sun" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><g fill="#ffd43b"><circle r="5" cy="12" cx="12"></circle><path d="m21 13h-1a1 1 0 0 1 0-2h1a1 1 0 0 1 0 2zm-17 0h-1a1 1 0 0 1 0-2h1a1 1 0 0 1 0 2zm13.66-5.66a1 1 0 0 1-.66-.29 1 1 0 0 1 0-1.41l.71-.71a1 1 0 1 1 1.41 1.41l-.71.71a1 1 0 0 1-.75.29zm-12.02 12.02a1 1 0 0 1-.71-.29 1 1 0 0 1 0-1.41l.71-.66a1 1 0 0 1 1.41 1.41l-.71.71a1 1 0 0 1-.7.24zm6.36-14.36a1 1 0 0 1-1-1v-1a1 1 0 0 1 2 0v1a1 1 0 0 1-1 1zm0 17a1 1 0 0 1-1-1v-1a1 1 0 0 1 2 0v1a1 1 0 0 1-1 1zm-5.66-14.66a1 1 0 0 1-.7-.29l-.71-.71a1 1 0 0 1 1.41-1.41l.71.71a1 1 0 0 1 0 1.41 1 1 0 0 1-.71.29zm12.02 12.02a1 1 0 0 1-.7-.29l-.66-.71a1 1 0 0 1 1.36-1.36l.71.71a1 1 0 0 1 0 1.41 1 1 0 0 1-.71.24z"></path></g></svg></span>
          <span class="moon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512"><path d="m223.5 32c-123.5 0-223.5 100.3-223.5 224s100 224 223.5 224c60.6 0 115.5-24.2 155.8-63.4 5-4.9 6.3-12.5 3.1-18.7s-10.1-9.7-17-8.5c-9.8 1.7-19.8 2.6-30.1 2.6-96.9 0-175.5-78.8-175.5-176 0-65.8 36-123.1 89.3-153.3 6.1-3.5 9.2-10.5 7.7-17.3s-7.3-11.9-14.3-12.5c-6.3-.5-12.6-.8-19-.8z"></path></svg></span>
          <input type="checkbox" class="input" data-theme-toggle aria-label="Ativar modo escuro" />
          <span class="slider"></span>
        </label>
      </nav>
    </header>

    <main id="auth-bg-field" class="auth-page hero-wrapper">
      <section class="form-container" aria-labelledby="reset-password-title">
        <p id="reset-password-title" class="login-title">Nova senha</p>
        <p class="login-sub-title">Escolha uma senha com pelo menos 8 caracteres e um símbolo.</p>

        <form id="redefinir-form" class="login-fields reset-password-form">
          <input
            class="login-input"
            name="senha"
            type="password"
            placeholder="Nova senha"
            aria-label="Nova senha"
            required
            minlength="8"
            maxlength="72"
            autocomplete="new-password"
          />
          <input
            class="login-input"
            name="confirmarSenha"
            type="password"
            placeholder="Confirmar nova senha"
            aria-label="Confirmar nova senha"
            required
            minlength="8"
            maxlength="72"
            autocomplete="new-password"
          />
          <p id="message" class="login-message" role="status" aria-live="polite"></p>
          <button class="form-btn" type="submit">Redefinir senha</button>
        </form>

        <div id="invalid-link" hidden>
          <p id="invalid-link-message" class="login-message error" role="status" aria-live="polite"></p>
          <p class="sign-up-label">
            <a class="sign-up-link" href="./esqueci-senha.html">Solicitar um novo link</a>
          </p>
        </div>

        <p class="sign-up-label">
          <a class="sign-up-link" href="./login.html">Voltar para o login</a>
        </p>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="./js/api-config.js"></script>
    <script src="./js/apiService.js"></script>
    <script src="./js/appUtils.js"></script>
    <script src="./js/redefinirSenha.js"></script>
    <script type="module" src="./js/authRibbonGlow.js"></script>
  </body>
</html>
