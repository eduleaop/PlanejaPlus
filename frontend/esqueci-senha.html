<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Esqueci minha senha | Planeja+</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./index.html">
        <img src="./img/logo.png" alt="Planeja+" class="brand-logo" />
      </a>
      <nav class="nav">
        <a href="./dashboard.html" data-auth-required>Dashboard</a>
        <a href="./cadastro.html" data-public-registration>Cadastro</a>
        <a href="./login.html">Login</a>
        <a href="./faq.html">FAQ</a>
      </nav>
    </header>

    <main id="auth-bg-field" class="auth-page hero-wrapper">
      <section class="form-container" aria-labelledby="forgot-password-title">
        <p id="forgot-password-title" class="login-title">Esqueci minha senha</p>
        <p class="login-sub-title">Informe seu email para receber um link de redefinição.</p>

        <form id="esqueci-form" class="login-fields">
          <input
            class="login-input"
            name="email"
            type="email"
            placeholder="Email"
            aria-label="Email"
            required
            autocomplete="email"
          />

          <p id="message" class="login-message" role="status" aria-live="polite"></p>
          <button class="form-btn" type="submit">Enviar link de recuperação</button>
        </form>

        <p class="sign-up-label">
          <a class="sign-up-link" href="./login.html">Voltar para o login</a>
        </p>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="./js/api-config.js"></script>
    <script src="./js/apiService.js"></script>
    <script src="./js/appUtils.js"></script>
    <script src="./js/esqueciSenha.js"></script>
    <script type="module" src="./js/authRibbonGlow.js"></script>
  </body>
</html>
