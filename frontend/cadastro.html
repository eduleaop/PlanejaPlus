<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro | Planeja+</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <!-- Cabecalho com links para navegar entre cadastro, login e dashboard. -->
    <header class="topbar">
      <a class="brand" href="./index.html">
        <img src="./img/logo.png" alt="Planeja+" class="brand-logo" />
      </a>
      <nav class="nav">
        <a href="./dashboard.html" data-auth-required>Dashboard</a>
        <a href="./login.html">Login</a>
        <a href="./faq.html">FAQ</a>
      </nav>
    </header>

    <!-- Area centralizada que apresenta o cartao de cadastro. -->
    <main id="auth-bg-field" class="auth-page hero-wrapper">
      <section class="form-container" aria-labelledby="registration-title">
        <p id="registration-title" class="login-title">Criar conta</p>
        <p class="login-sub-title">Comece a organizar suas finanças com o Planeja+</p>

        <!-- Formulario lido pelo cadastro.js para enviar os dados ao backend. -->
        <form id="cadastro-form" class="login-fields">
          <input
            class="login-input"
            name="nome"
            type="text"
            placeholder="Nome"
            aria-label="Nome"
            autocomplete="name"
            required
          />
          <input
            class="login-input"
            name="email"
            type="email"
            placeholder="Email"
            aria-label="Email"
            autocomplete="email"
            required
          />
          <input
            class="login-input"
            name="senha"
            type="password"
            placeholder="Senha"
            aria-label="Senha"
            autocomplete="new-password"
            minlength="6"
            required
          />
          <p id="message" class="login-message" role="status" aria-live="polite"></p>
          <button class="form-btn" type="submit">Criar conta</button>
        </form>

        <p class="sign-up-label">
          Já tem uma conta?
          <a class="sign-up-link" href="./login.html">Entrar</a>
        </p>
        <p id="registration-disabled" class="login-message error" role="status" hidden></p>
      </section>
    </main>
    <!-- Dependencias e scripts da pagina. -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="./js/api-config.js"></script>
    <script src="./js/apiService.js"></script>
    <script src="./js/appUtils.js"></script>
    <script src="./js/cadastro.js"></script>
    <script type="module" src="./js/authRibbonGlow.js"></script>
  </body>
</html>
