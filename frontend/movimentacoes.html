<!doctype html>
<html lang="pt-BR" class="transactions-document">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movimentacoes | Planeja+</title>
    <script src="./js/theme.js"></script>
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="stylesheet" href="./css/theme.css" />
  </head>
  <body class="transactions-body">
    <!-- Cabecalho das paginas internas com navegacao entre modulos. -->
    <header class="topbar">
      <a class="brand" href="./index.html">
        <img src="./img/logo.png" alt="Planeja+" class="brand-logo brand-logo-light" />
        <img src="./img/logo-dark.png" alt="" aria-hidden="true" class="brand-logo brand-logo-dark" />
      </a>
      <nav class="nav">
        <a href="./dashboard.html">Dashboard</a>
        <a href="./movimentacoes.html" aria-current="page">Movimentações</a>
        <a href="./categorias.html">Categorias</a>
        <a href="./relatorios.html">Relatórios</a>
        <a href="./faq.html">FAQ</a>
        <a href="./admin.html" data-admin-link>Admin</a>
        <a href="./login.html" data-logout>Sair</a>
        <label class="switch">
          <span class="sun" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><g fill="#ffd43b"><circle r="5" cy="12" cx="12"></circle><path d="m21 13h-1a1 1 0 0 1 0-2h1a1 1 0 0 1 0 2zm-17 0h-1a1 1 0 0 1 0-2h1a1 1 0 0 1 0 2zm13.66-5.66a1 1 0 0 1-.66-.29 1 1 0 0 1 0-1.41l.71-.71a1 1 0 1 1 1.41 1.41l-.71.71a1 1 0 0 1-.75.29zm-12.02 12.02a1 1 0 0 1-.71-.29 1 1 0 0 1 0-1.41l.71-.66a1 1 0 0 1 1.41 1.41l-.71.71a1 1 0 0 1-.7.24zm6.36-14.36a1 1 0 0 1-1-1v-1a1 1 0 0 1 2 0v1a1 1 0 0 1-1 1zm0 17a1 1 0 0 1-1-1v-1a1 1 0 0 1 2 0v1a1 1 0 0 1-1 1zm-5.66-14.66a1 1 0 0 1-.7-.29l-.71-.71a1 1 0 0 1 1.41-1.41l.71.71a1 1 0 0 1 0 1.41 1 1 0 0 1-.71.29zm12.02 12.02a1 1 0 0 1-.7-.29l-.66-.71a1 1 0 0 1 1.36-1.36l.71.71a1 1 0 0 1 0 1.41 1 1 0 0 1-.71.24z"></path></g></svg></span>
          <span class="moon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512"><path d="m223.5 32c-123.5 0-223.5 100.3-223.5 224s100 224 223.5 224c60.6 0 115.5-24.2 155.8-63.4 5-4.9 6.3-12.5 3.1-18.7s-10.1-9.7-17-8.5c-9.8 1.7-19.8 2.6-30.1 2.6-96.9 0-175.5-78.8-175.5-176 0-65.8 36-123.1 89.3-153.3 6.1-3.5 9.2-10.5 7.7-17.3s-7.3-11.9-14.3-12.5c-6.3-.5-12.6-.8-19-.8z"></path></svg></span>
          <input type="checkbox" class="input" data-theme-toggle aria-label="Ativar modo escuro" />
          <span class="slider"></span>
        </label>
      </nav>
    </header>

    <main class="transactions-page transactions-layout">
      <section class="transactions-main">
        <header class="transactions-heading">
          <p id="mes-atual" class="transactions-month"></p>
          <h1>Movimentações</h1>
        </header>

        <section class="panel transactions-panel" aria-label="Lista de movimentações">
          <div class="transactions-toolbar">
            <label class="transaction-search movement-search">
              <span class="visually-hidden">Buscar por descrição</span>
              <input id="buscar-movimentacoes" type="search" placeholder="Buscar por descrição" />
            </label>
            <div class="transaction-filters movement-filters" role="group" aria-label="Filtrar movimentações">
              <button class="transaction-filter movement-filter is-active" type="button" data-filtro="todas" aria-pressed="true">Todas</button>
              <button class="transaction-filter movement-filter" type="button" data-filtro="receita" aria-pressed="false">Entradas</button>
              <button class="transaction-filter movement-filter" type="button" data-filtro="despesa" aria-pressed="false">Saídas</button>
            </div>
          </div>
          <div class="table-wrap transactions-table-wrap">
            <table class="transactions-table">
              <thead>
                <tr>
                  <th scope="col">Descrição</th>
                  <th scope="col">Data</th>
                  <th scope="col" class="col-value">Valor</th>
                  <th scope="col"><span class="visually-hidden">Ações</span></th>
                </tr>
              </thead>
              <tbody id="movimentacoes-lista"></tbody>
            </table>
          </div>
        </section>
      </section>

      <aside class="transaction-form-panel panel">
        <h2>Nova movimentação</h2>
        <form id="movimentacao-form" class="form">
          <input name="id" type="hidden" />

          <label>
            Categoria
            <select name="categoria_id" required></select>
          </label>

          <label>
            Descrição
            <input name="descricao" type="text" placeholder="Ex.: Restaurante, mercado, etc." required />
          </label>

          <div class="form-row">
            <label>
              Valor
              <input name="valor" type="number" step="0.01" min="0.01" placeholder="R$" required />
            </label>

            <label>
              Tipo
              <select name="tipo" required>
                <option value="despesa">Saída</option>
                <option value="receita">Entrada</option>
              </select>
            </label>
          </div>

          <label>
            Data
            <input name="data_movimentacao" type="date" required />
          </label>

          <div class="actions compact">
            <button class="button primary" type="submit">Salvar</button>
            <button id="cancelar-edicao" class="button secondary" type="button">Limpar</button>
          </div>
          <p id="message" class="message" role="status"></p>
        </form>
      </aside>
    </main>
    <!-- Dependencias e scripts da tela de movimentacoes. -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="./js/api-config.js"></script>
    <script src="./js/apiService.js"></script>
    <script src="./js/appUtils.js"></script>
    <script src="./js/movimentacoes.js"></script>
    <script>
      const monthLabel = new Intl.DateTimeFormat('pt-BR', { month: 'long', year: 'numeric' }).format(new Date());
      document.querySelector('#mes-atual').textContent = monthLabel;
    </script>
  </body>
</html>
