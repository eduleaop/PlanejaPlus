<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Planeja+</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <!-- Cabecalho simples da tela de login. -->
    <header class="topbar">
      <a class="brand" href="./index.html">
        <img src="./img/logo.png" alt="Planeja+" class="brand-logo" />
      </a>
      <nav class="nav">
        <a href="./dashboard.html" data-auth-required>Dashboard</a>
        <a href="./cadastro.html" data-public-registration>Cadastro</a>
        <a href="./faq.html">FAQ</a>
      </nav>
    </header>

    <!-- Area centralizada que apresenta o cartao de login. -->
    <main id="auth-bg-field" class="auth-page hero-wrapper">
      <!-- Formulario de autenticacao conectado ao script login.js. -->
      <form id="login-form" class="form-container">
        <p class="login-title">Entrar</p>
        <p class="login-sub-title">Acesse sua conta Planeja+ para continuar</p>
        <div class="login-fields">
          <input
            class="login-input"
            name="email"
            type="email"
            placeholder="Email"
            aria-label="Email"
            autocomplete="email"
            required
          />
          <input
            class="login-input"
            name="senha"
            type="password"
            placeholder="Senha"
            aria-label="Senha"
            autocomplete="current-password"
            required
          />
          <p class="auth-forgot">
            <a class="sign-up-link" href="./esqueci-senha.html">Esqueci minha senha</a>
          </p>
          <p id="message" class="login-message" role="status" aria-live="polite"></p>
          <button class="form-btn" type="submit">Entrar</button>
        </div>
        <p class="sign-up-label">
          Ainda não tem uma conta?
          <a class="sign-up-link" href="./cadastro.html" data-public-registration>Criar conta</a>
        </p>
      </form>
    </main>
    <!-- Bibliotecas e scripts carregados no fim para encontrar o HTML ja montado. -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="./js/api-config.js"></script>
    <script src="./js/apiService.js"></script>
    <script src="./js/appUtils.js"></script>
    <script src="./js/login.js"></script>
    <script type="module" src="./js/authRibbonGlow.js"></script>
  </body>
</html>
