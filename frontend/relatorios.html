<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Relatorios | Planeja+</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body class="reports-body">
    <!-- Cabecalho das paginas internas com link para sair. -->
    <header class="topbar">
      <a class="brand" href="./index.html">
        <img src="./img/logo.png" alt="Planeja+" class="brand-logo" />
      </a>
      <nav class="nav">
        <a href="./dashboard.html">Dashboard</a>
        <a href="./movimentacoes.html">Movimentações</a>
        <a href="./categorias.html">Categorias</a>
        <a href="./relatorios.html" aria-current="page">Relatórios</a>
        <a href="./faq.html">FAQ</a>
        <a href="./admin.html" data-admin-link>Admin</a>
        <a href="./login.html" data-logout>Sair</a>
      </nav>
    </header>

    <!-- Conteudo principal de filtros, resumo e tabela do relatorio. -->
    <main class="reports-page">
      <!-- Titulo e descricao da pagina de relatorios. -->
      <section class="page-heading reports-heading">
        <p class="eyebrow">Análise</p>
        <h1>Relatórios</h1>
        <p class="muted">Filtre as movimentações por período e exporte o resumo em PDF.</p>
      </section>

      <!-- Formulario de filtros usado pelo relatorios.js. -->
      <section class="panel reports-filter-panel">
        <form class="filters reports-filters">
          <label>
            Data inicial
            <input id="periodo-inicio" type="date" />
          </label>

          <label>
            Data final
            <input id="periodo-fim" type="date" />
          </label>

          <label>
            Tipo
            <select id="relatorio-tipo">
              <option value="todos">Todos</option>
              <option value="receita">Receitas</option>
              <option value="despesa">Despesas</option>
            </select>
          </label>

          <button class="button primary" type="submit">
            <svg aria-hidden="true" viewBox="0 0 16 16"><path d="M8 1.5v8m0 0 3-3m-3 3-3-3M2.5 10.5v3h11v-3" /></svg>
            Gerar relatório
          </button>
          <button id="exportar-pdf" class="button secondary" type="button">
            <svg aria-hidden="true" viewBox="0 0 16 16"><path d="M8 2v8m0 0 3-3m-3 3-3-3M2.5 10.5v3h11v-3" /></svg>
            Exportar PDF
          </button>
          <button id="exportar-excel" class="button secondary" type="button">
            <svg aria-hidden="true" viewBox="0 0 16 16"><path d="M8 2v8m0 0 3-3m-3 3-3-3M2.5 10.5v3h11v-3" /></svg>
            Exportar Excel
          </button>
        </form>
      </section>

      <!-- Cards de totais atualizados conforme o filtro do relatorio. -->
      <section class="stats-grid reports-stats">
        <article class="stat-card reports-stat-card">
          <span class="reports-stat-icon reports-stat-icon--income" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="m4 16 6-6 4 4 6-7M14 7h6v6" /></svg>
          </span>
          <div class="reports-stat-info">
            <p class="stat-label">Total de receitas</p>
            <strong id="relatorio-receitas" class="positive">R$ 0,00</strong>
          </div>
        </article>

        <article class="stat-card reports-stat-card">
          <span class="reports-stat-icon reports-stat-icon--expense" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="m4 8 6 6 4-4 6 7m-6 0h6v-6" /></svg>
          </span>
          <div class="reports-stat-info">
            <p class="stat-label">Total de despesas</p>
            <strong id="relatorio-despesas" class="negative">R$ 0,00</strong>
          </div>
        </article>

        <article class="stat-card reports-stat-card">
          <span class="reports-stat-icon reports-stat-icon--balance" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M5 8h14M5 16h14" /></svg>
          </span>
          <div class="reports-stat-info">
            <p class="stat-label">Resultado</p>
            <strong id="relatorio-saldo">R$ 0,00</strong>
          </div>
        </article>
      </section>

      <!-- Tabela de detalhamento agrupado por categoria e tipo. -->
      <section class="panel reports-detail-panel">
        <h2>Detalhamento</h2>
        <p id="message" class="message" role="status"></p>
        <div class="table-wrap">
          <table class="reports-table">
            <thead>
              <tr>
                <th>Categoria</th>
                <th>Tipo</th>
                <th>Quantidade</th>
                <th>Total</th>
              </tr>
            </thead>
            <tbody id="relatorio-detalhes"></tbody>
          </table>
        </div>
      </section>
    </main>
    <!-- Bibliotecas externas e scripts locais usados no relatorio. -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
    <script src="./js/api-config.js"></script>
    <script src="./js/apiService.js"></script>
    <script src="./js/appUtils.js"></script>
    <script src="./js/relatorios.js"></script>
  </body>
</html>
